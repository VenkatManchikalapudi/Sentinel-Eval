name: Sentinel-Eval Compliance Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: "0 2 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Ollama service
        run: |
          # For CI/CD: Mock Ollama or use a containerized Ollama service
          # Option 1: Use Docker container for Ollama
          docker run -d \
            --name ollama \
            -p 11434:11434 \
            ollama/ollama:latest

          # Wait for Ollama to be ready
          sleep 10

          # Pull the model
          docker exec ollama ollama pull deepseek-r1:8b || true
        continue-on-error: true

      - name: Run Financial Safety Tests
        run: |
          pytest tests/test_financial_agent.py -v --tb=short
        continue-on-error: true

      - name: Run Compliance Tests with Ollama
        run: |
          pytest tests/test_compliance.py -v --tb=short
        continue-on-error: true
        env:
          OLLAMA_BASE_URL: http://localhost:11434

      - name: Generate coverage report
        run: |
          pip install pytest-cov
          pytest tests/ --cov=tests --cov-report=xml --cov-report=html
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Create test report
        if: always()
        run: |
          mkdir -p reports
          pytest tests/ --html=reports/test-report.html --self-contained-html || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: reports/

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install linting tools
        run: |
          pip install pylint flake8 black isort

      - name: Run Black formatter check
        run: black --check tests/ || echo "Files would be reformatted"
        continue-on-error: true

      - name: Run isort import check
        run: isort --check-only tests/ || echo "Imports need sorting"
        continue-on-error: true

      - name: Run Flake8 linter
        run: flake8 tests/ --max-line-length=100
        continue-on-error: true

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit security scan
        run: bandit -r tests/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Check dependencies for vulnerabilities
        run: safety check --json || true
        continue-on-error: true

  documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install documentation tools
        run: pip install sphinx sphinx-rtd-theme

      - name: Check documentation generation
        run: |
          mkdir -p build
          sphinx-build -b html docs/ build/docs/ || echo "Documentation build skipped"
        continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: always()

    steps:
      - name: Determine job status
        run: |
          if [ "${{ needs.test.result }}" == "failure" ] || \
             [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.security.result }}" == "failure" ]; then
            echo "WORKFLOW_STATUS=failed" >> $GITHUB_ENV
          else
            echo "WORKFLOW_STATUS=passed" >> $GITHUB_ENV
          fi

      - name: Post status summary
        run: |
          echo "## Sentinel-Eval CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Status**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Lint Status**: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Status**: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Overall**: ${{ env.WORKFLOW_STATUS }}" >> $GITHUB_STEP_SUMMARY
