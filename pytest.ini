[pytest]
# Pytest configuration for Sentinel-Eval

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short

# Markers for organizing tests
markers =
    safety: Tests for security and safety checks
    credentials: Tests for credential/API key leakage detection
    financial_advice: Tests for illegal financial advice detection
